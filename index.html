<!DOCTYPE html>
<html lang="pl">
<head>

  <meta name="mobile-web-app-capable" content="yes">

<body>
  <header class="top">

      <span class="tram" aria-hidden="true">🚋</span>

    <div id="banner" class="banner" hidden></div>

  <main class="boards">
    <section class="board" data-stop="2031" aria-labelledby="h2031">

      <h2 id="h2030"><span class="badge">02</span><span class="dir">→ PRZECIWNY KIERUNEK</span></h2>
      <ol class="list" aria-live="polite"><li class="msg">Ładowanie…</li></ol>

  <footer class="foot">Dane: ZTM Gdańsk / TRISTAR (Otwarte Dane Gdańsk) · odświeżanie co 20 s</footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
