name: API check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query ZTM API
        run: |
          mkdir out
          for s in 2031 2030; do
            curl -sS -m 20 -D out/headers-$s.txt -o out/body-$s.json \
              -H "Origin: https://999gf999.github.io" "https://ckan2.multimediagdansk.pl/departures?stopId=$s" || echo "curl failed" > out/err-$s.txt
            curl -sS -m 20 -i -X OPTIONS -H "Origin: https://999gf999.github.io" \
              -H "Access-Control-Request-Method: GET" "https://ckan2.multimediagdansk.pl/departures?stopId=$s" | head -30 > out/preflight-$s.txt || true
          done
          date -u > out/run-utc.txt
      - name: Publish results to api-check branch
        run: |
          cd out
          git init -q -b api-check
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "API check results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" api-check
