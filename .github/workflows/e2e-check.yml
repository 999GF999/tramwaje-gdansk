name: E2E check
on:
  push:
    paths: ['.github/workflows/e2e-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages deploy
        run: sleep 60
      - name: Proxy + CORS
        run: |
          mkdir out
          for s in 2031 2030; do
            curl -sS -m 20 -D out/proxy-headers-$s.txt -o out/proxy-body-$s.json -H "Origin: https://999gf999.github.io" "https://tramwaje-proxy.pb-jankowski.workers.dev/departures?stopId=$s" || true
          done
          curl -sS -m 20 -i -X OPTIONS -H "Origin: https://999gf999.github.io" -H "Access-Control-Request-Method: GET" "https://tramwaje-proxy.pb-jankowski.workers.dev/departures?stopId=2031" > out/proxy-preflight.txt || true
          curl -sS -m 20 -I https://999gf999.github.io/tramwaje-gdansk/ > out/pages-head.txt || true
          curl -sS -m 20 https://999gf999.github.io/tramwaje-gdansk/js/config.js > out/pages-config.js || true
          curl -sS -m 20 -I https://999gf999.github.io/tramwaje-gdansk/manifest.webmanifest > out/manifest-head.txt || true
      - name: Browser test
        run: |
          pip install -q playwright
          cat > t.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome")
                  ctx = await b.new_context(viewport={"width":412,"height":915}, device_scale_factor=2, locale="pl-PL", timezone_id="Europe/Warsaw")
                  pg = await ctx.new_page()
                  logs=[]
                  pg.on("console", lambda m: logs.append(f"{m.type}: {m.text}"))
                  pg.on("requestfailed", lambda r: logs.append(f"FAILED {r.url} {r.failure}"))
                  pg.on("response", lambda r: logs.append(f"RESP {r.status} {r.url}"))
                  await pg.goto("https://999gf999.github.io/tramwaje-gdansk/", wait_until="networkidle")
                  await pg.wait_for_timeout(4000)
                  await pg.screenshot(path="out/screenshot.png", full_page=True)
                  info = await pg.evaluate("""async () => {
                    const reg = await navigator.serviceWorker.getRegistration();
                    const m = await (await fetch(document.querySelector('link[rel=manifest]').href)).json();
                    return {sw: reg ? {scope: reg.scope, active: !!reg.active} : null, manifest: m,
                            text: document.body.innerText, url: location.href};
                  }""")
                  # reload to see SW control, then offline test
                  await pg.reload(wait_until="networkidle"); await pg.wait_for_timeout(3000)
                  info["controlled"] = await pg.evaluate("!!navigator.serviceWorker.controller")
                  await ctx.set_offline(True)
                  await pg.reload(); await pg.wait_for_timeout(3000)
                  info["offline_text"] = await pg.evaluate("document.body.innerText")
                  await pg.screenshot(path="out/offline.png", full_page=True)
                  info["logs"] = logs
                  json.dump(info, open("out/browser.json","w"), ensure_ascii=False, indent=1)
                  await b.close()
          asyncio.run(main())
          PY
          python t.py || echo "browser test failed" > out/browser-error.txt
      - name: Publish results
        if: always()
        run: |
          cd out
          git init -q -b api-check
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "E2E results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" api-check
